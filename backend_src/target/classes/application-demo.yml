# ============================================================
# Demo 模式配置 — 使用 H2 内存数据库，无需安装 MySQL
# 启动方式: java -jar studyroom.jar --spring.profiles.active=demo
# ============================================================
server:
  port: 8080
  address: 0.0.0.0

spring:
  datasource:
    url: jdbc:h2:file:./data/studyroom;MODE=MySQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver

  # 自动初始化数据库（schema.sql + data.sql）
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      data-locations: classpath:data.sql

  # H2 Web Console（方便老师查看数据）
  h2:
    console:
      enabled: true
      path: /h2-console

  # 邮箱功能在 demo 模式下禁用
  mail:
    host: ""
    port: 0
    username: ""
    password: ""
